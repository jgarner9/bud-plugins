name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # For claude plugin validate; no login needed.
      - run: npm install -g @anthropic-ai/claude-code
      - run: shellcheck tests/check.sh
      - run: tests/check.sh
